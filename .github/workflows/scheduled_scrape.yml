name: Scheduled Job Scrape

on:
  schedule:
    # Runs daily at 09:00 UTC, which is 11:00 German time (CEST, UTC+2,
    # in effect roughly late March - late October). During CET
    # (UTC+1, winter), this shifts to 10:00 German time instead - GitHub
    # Actions cron has no built-in daylight-saving awareness, so this
    # would need updating to "0 10 * * *" for exact precision across
    # the winter months if that hour matters. A 1-hour seasonal drift
    # twice a year is an acceptable tradeoff otherwise.
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Allows triggering manually from the Actions tab, useful for
    # testing without waiting for the schedule.

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled scrape and scoring
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: |
          cd src
          python scheduled_run.py
