name: Scheduled Job Scrape

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust the cron expression to change
    # the time - https://crontab.guru is useful for this.
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allows triggering manually from the Actions tab, useful for
    # testing without waiting for the schedule.

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled scrape and scoring
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: |
          cd src
          python scheduled_run.py
